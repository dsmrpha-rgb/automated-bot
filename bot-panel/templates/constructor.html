<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Builder — {{ display_name }}</title>
<style>
:root{--bg:#0f1117;--bg2:#1a1d27;--bg3:#242836;--border:#2e3345;--text:#e1e4ed;--text2:#8b8fa3;--accent:#6c5ce7;--accent2:#a29bfe;--green:#00b894;--red:#e17055;--yellow:#fdcb6e;--blue:#74b9ff;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:14px}
button{font-family:inherit;font-size:13px;cursor:pointer;color:var(--text);background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:6px 11px}
button:hover{border-color:var(--accent2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.1)}
button.good{background:var(--green);border-color:var(--green);color:#04281f;font-weight:700}
button.danger{color:var(--red)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2)}
textarea{resize:vertical;min-height:90px;line-height:1.45}
label.f{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin:12px 0 5px}
.hint{font-size:12px;color:var(--text2);line-height:1.45;margin-top:5px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:0 0 auto}.row>.grow{flex:1 1 auto;min-width:0}
.mut{color:var(--text2)}

/* top bar */
#top{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
#top .title{font-weight:700;font-size:15px;white-space:nowrap}
#top .sp{flex:1}
#status{font-size:12px;padding:4px 10px;border-radius:12px;background:var(--bg3);color:var(--text2);white-space:nowrap}
#status.dirty{background:rgba(253,203,110,.15);color:var(--yellow)}
#status.ok{background:rgba(0,184,148,.15);color:var(--green)}
.langtabs{display:flex;gap:4px}
.langtabs button{padding:4px 9px;font-size:12px}
.langtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#issuesBtn.has{color:var(--yellow);border-color:var(--yellow)}
#issuesBtn.err{color:var(--red);border-color:var(--red)}

/* layout */
#main{display:flex;height:calc(100vh - 52px)}
#canvasWrap{flex:1;position:relative;overflow:hidden;background:var(--bg);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:24px 24px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.tools{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:5}
.zoom{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;z-index:5}
.tips{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:var(--text2);background:rgba(26,29,39,.9);padding:5px 12px;border-radius:14px;z-index:4;pointer-events:none;white-space:nowrap}
.node{position:absolute;width:230px;background:var(--bg2);border:2px solid var(--border);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.35);user-select:none}
.node.sel{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(162,155,254,.2),0 4px 18px rgba(0,0,0,.35)}
.node.warn{border-color:var(--yellow)}
.node.dropok{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,184,148,.25)}
.nh{padding:8px 10px;display:flex;align-items:center;gap:7px;cursor:grab;border-bottom:1px solid var(--border);border-radius:10px 10px 0 0;background:var(--bg3)}
.nh .ic{font-size:15px}.nh .nt{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nh .st{font-size:10px;background:var(--green);color:#04281f;padding:2px 6px;border-radius:9px;font-weight:700}
.nb{padding:8px 10px 6px;font-size:12px;color:var(--text2);line-height:1.4;max-height:58px;overflow:hidden}
.chips{padding:2px 8px 8px}
.chip{position:relative;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 22px 4px 8px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--accent2)}
.chip.rowmark{border-top-color:var(--accent)}
.chip .port{position:absolute;right:-1px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--accent);border:2px solid var(--bg2);cursor:crosshair}
.chip .port:hover{background:var(--green);transform:scale(1.25)}
.nempty{font-size:12px;color:var(--text2);padding:2px 10px 10px;font-style:italic}
.edge{fill:none;stroke-width:2;opacity:.75}
.edge.page{stroke:var(--accent2)}.edge.choose{stroke:var(--blue)}.edge.confirm{stroke:var(--green)}.edge.flow{stroke:var(--yellow);stroke-dasharray:6 4}
.edge.back{opacity:.22;stroke-dasharray:3 4}
.edge.hot{opacity:1;stroke-width:3;stroke-dasharray:none}

/* inspector */
#side{width:410px;flex:0 0 410px;background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;padding:14px 16px 60px}
#side h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
#side h3 .ln{flex:1;height:1px;background:var(--border)}
.empty{color:var(--text2);text-align:center;padding:50px 20px;line-height:1.6}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg .opt{padding:8px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--bg)}
.seg .opt.on{border-color:var(--accent2);background:rgba(108,92,231,.15)}
.seg .opt b{display:block;font-size:13px}.seg .opt span{font-size:11px;color:var(--text2)}
.fmtbar{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap}
.fmtbar button{padding:3px 8px;font-size:12px}
.rowbox{border:1px dashed var(--border);border-radius:9px;padding:8px;margin-bottom:8px;background:var(--bg)}
.rowhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.btnline{display:flex;gap:6px;flex-wrap:wrap}
.bchip{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:4px 4px 4px 9px;font-size:12px;cursor:pointer;max-width:100%}
.bchip.on{border-color:var(--accent2);background:rgba(108,92,231,.18)}
.bchip .tx{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bchip .x{padding:0 5px;border:none;background:none;color:var(--text2);font-size:12px}
.bchip .x:hover{color:var(--red)}
.bed{border:1px solid var(--accent2);border-radius:9px;padding:10px 12px 12px;margin:8px 0 10px;background:var(--bg3)}
.bed .acts{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.card{border:1px solid var(--border);background:var(--bg);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:9px;background:var(--bg3);color:var(--text2);margin-left:4px}
.tag.g{background:rgba(0,184,148,.15);color:var(--green)}
.tag.y{background:rgba(253,203,110,.15);color:var(--yellow)}
.tag.r{background:rgba(225,112,85,.15);color:var(--red)}
details.adv>summary{cursor:pointer;color:var(--text2);font-size:12px;margin:14px 0 6px;user-select:none}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer}
.chk input{width:auto}

/* phone */
#phone{position:absolute;right:14px;bottom:14px;width:300px;z-index:6;background:#0e1621;border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100% - 28px)}
#phone .ph{background:#17212b;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
#phone .ph .av{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px}
#phone .ph button{margin-left:auto;padding:2px 8px}
#phone .chat{padding:12px 10px;overflow-y:auto;flex:1}
.bub{background:#182533;border-radius:12px 12px 12px 3px;overflow:hidden;font-size:13px;line-height:1.4;color:#e8eef5;word-wrap:break-word}
.bub img,.bub video{display:block;width:100%;max-height:200px;object-fit:cover}
.bub .noimg{background:#1f3347;color:#7e9bb5;font-size:11px;padding:30px 10px;text-align:center}
.bub .tx{padding:8px 11px;white-space:normal}
.bub code{background:#0e1621;padding:1px 5px;border-radius:4px;font-family:ui-monospace,monospace;font-size:12px}
.bub a{color:#6ab3f3}
.kb{margin-top:5px;display:flex;flex-direction:column;gap:4px}
.kb .kr{display:flex;gap:4px}
.kb button{flex:1;background:#2b5278;border:none;color:#fff;padding:8px 6px;font-size:12px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb button:hover{background:#34628f}
.rkb{background:#0e1621;border-top:1px solid #1f2c3a;padding:6px;display:flex;flex-direction:column;gap:4px}
.rkb .kr{display:flex;gap:4px}
.rkb button{flex:1;background:#2b3a4a;border:none;color:#e8eef5;padding:9px 6px;font-size:12px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rkb button:hover{background:#34475b}
.rkb .ph-in{font-size:11px;color:#6c7c8c;padding:4px 6px 2px}
.phnote{font-size:11px;color:#7e9bb5;margin-top:8px;text-align:center}
.askbox{display:flex;gap:4px;margin-top:8px}.askbox input{background:#17212b;border-color:#2b3947}

/* modals */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:min(920px,100%);max-height:90vh;display:flex;flex-direction:column}
.modal.sm{width:min(520px,100%)}
.mh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.mh h2{font-size:16px;flex:1}
.mb{padding:16px 18px;overflow-y:auto;flex:1}
.mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.stabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--border);overflow-x:auto}
.stabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:11px 14px;color:var(--text2);white-space:nowrap}
.stabs button.on{color:var(--text);border-bottom-color:var(--accent2)}
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.imgc{border:2px solid var(--border);border-radius:9px;overflow:hidden;cursor:pointer;background:var(--bg);position:relative}
.imgc:hover,.imgc.on{border-color:var(--accent2)}
.imgc img,.imgc video{display:block;width:100%;height:90px;object-fit:cover}
.imgc .kd{position:absolute;left:4px;top:4px;background:#000a;color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}
.imgc .nm{font-size:11px;padding:4px 6px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgc .del{position:absolute;top:3px;right:3px;padding:0 6px;background:rgba(0,0,0,.7);border-color:transparent}
.drop{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;color:var(--text2);margin-bottom:12px}
.drop.over{border-color:var(--accent2);background:rgba(108,92,231,.1)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);padding:10px 18px;border-radius:10px;z-index:90;display:none;max-width:80vw}
#toast.err{border-color:var(--red);color:var(--red)}#toast.ok{border-color:var(--green)}
.iss{display:flex;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bg);margin-bottom:6px;cursor:pointer;border:1px solid var(--border)}
.iss:hover{border-color:var(--accent2)}
table.t{width:100%;border-collapse:collapse}table.t td,table.t th{padding:6px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
table.t th{font-size:11px;text-transform:uppercase;color:var(--text2);letter-spacing:.5px}
@media (max-width:1100px){ #side{width:340px;flex-basis:340px} #phone{width:260px}}
</style>
</head>
<body>
<script>const NAME={{ name|tojson }},DISPLAY={{ display_name|tojson }};</script>
<div id="top">
  <a href="/constructor" class="mut" style="text-decoration:none" title="All constructor bots">← Bots</a>
  <span class="title" id="botTitle"></span>
  <span id="status">Loading…</span>
  <span class="sp"></span>
  <span class="mut" style="font-size:12px">Editing</span><div class="langtabs" id="langTabs"></div>
  <button id="undoBtn" title="Undo (Ctrl+Z)">↶</button><button id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button>
  <button id="issuesBtn">✔ No problems</button>
  <button id="phoneBtn">📱 Preview</button>
  <button id="settingsBtn">⚙ Settings</button>
  <button class="good" id="publishBtn" title="Ctrl+S">Publish</button>
</div>
<div id="main">
  <div id="canvasWrap">
    <div class="tools"><button class="primary" id="addScreen">＋ New screen</button><button id="addFlow" title="Add a ready-made shop flow (cities, categories, listing, districts, payment…)">🧩 Add a flow</button><button id="autoLayout" title="Tidy up the screen layout">⇄ Auto-arrange</button><button id="fitBtn">⤢ Fit</button></div>
    <div id="world"><svg id="edges"></svg><div id="nodes"></div></div>
    <div class="zoom"><button id="zOut">−</button><button id="zIn">＋</button></div>
    <div class="tips" id="tips">Drag screens to arrange · drag from a button's dot to a screen to connect them · scroll to zoom</div>
    <div id="phone"></div>
  </div>
  <div id="side"></div>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>
{% raw %}
<script>
// ══ helpers ═════════════════════════════════════════════════════════════
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') e[k] = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) { if (k === null || k === undefined || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const LANG_NAMES = {en: 'English', ka: 'ქართული', ru: 'Русский'};
const TYPE_INFO = {
  message: {ic: '💬', name: 'Message', sub: 'Text, image and buttons'},
  input: {ic: '⌨️', name: 'Ask for input', sub: 'Waits for the user to type'},
  list: {ic: '🛍', name: 'Item list', sub: 'Cities, categories, products or districts from the shop'},
  receipt: {ic: '💳', name: 'Payment', sub: 'Crypto address + amount'},
  history: {ic: '🧾', name: 'Purchase history', sub: 'Lists what the user bought'},
};
const BUILTINS = {products: 'Shop products', balance: 'Balance & top-up', language: 'Language picker'};
const ADMIN_ITEMS = [
  ['products', '📦 Products'], ['districts', '🗺 Districts'], ['broadcast', '📢 Announcement'], ['dm', '✉ Direct message'],
  ['scheduled', '📅 Scheduled posts'], ['private', '🔒 Private listings'], ['users', '👥 Users'], ['purchases', '🧾 Purchase history'], ['stats', '📊 Statistics'],
];
const KNOWN_COINS = {BTC: 'bitcoin', LTC: 'litecoin', ETH: 'ethereum', TRX: 'tron', TON: 'the-open-network', SOL: 'solana', DOGE: 'dogecoin', XRP: 'ripple', BNB: 'binancecoin', BCH: 'bitcoin-cash'};
const DEFAULT_COINS = [
  {code: 'BTC', label: 'Bitcoin', cg_id: 'bitcoin', stable: false, enabled: true},
  {code: 'LTC', label: 'Litecoin', cg_id: 'litecoin', stable: false, enabled: true},
  {code: 'USDT', label: 'USDT TRC20', cg_id: '', stable: true, enabled: true},
];

let toastT;
function toast(msg, kind = '') { const t = $('#toast'); t.textContent = msg; t.className = kind; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', kind === 'err' ? 6000 : 2600); }
async function api(path, opts = {}) {
  const o = {method: opts.method || (opts.body ? 'POST' : 'GET'), headers: opts.hdr ? {'X-GA': '1'} : {}};
  if (opts.body instanceof FormData) o.body = opts.body;
  else if (opts.body) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  const r = await fetch(path, o);
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
const B = p => `/bot/${NAME}${p}`;
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ══ state ═══════════════════════════════════════════════════════════════
let cfg = null, publishedStr = '', sel = null, editLang = 'en', selBtn = null;   // selBtn = [row, col]
let undoStack = [], redoStack = [], lastPush = 0;
let envState = null, envOrig = '', sysStrings = {}, previewData = {products: [], districts: []}, images = [], features = {};
let view = {x: 40, y: 40, s: 1};
let pv = {page: null, vars: {}, history: []};
let showPhone = true;
const dirtyCfg = () => JSON.stringify(cfg) !== publishedStr;
const dirtyEnv = () => !!envState && JSON.stringify(envState) !== envOrig;
const dirty = () => dirtyCfg() || dirtyEnv();

function normalize(c) {
  c.langs = (c.langs && c.langs.length ? c.langs : ['en']);
  c.default_lang = c.langs.includes(c.default_lang) ? c.default_lang : c.langs[0];
  const dl = c.default_lang;
  const ml = v => typeof v === 'string' ? {[dl]: v} : (v && typeof v === 'object' ? v : {});
  for (const [id, p] of Object.entries(c.pages)) {
    p.type = p.type || 'message';
    p.text = ml(p.text); p.rows = p.rows || [];
    p.parse_mode = p.parse_mode === undefined ? 'HTML' : p.parse_mode;
    p.image = p.image || '';
    for (const row of p.rows) for (const b of row) { b.label = ml(b.label); b.action = b.action || 'noop'; }
    if (p.input) p.input.error = ml(p.input.error);
    if (p.on_enter) {
      p.on_enter.notify_admins = ml(p.on_enter.notify_admins);
      p.on_enter.send = (p.on_enter.send || []).map(x => ({text: ml(x.text), image: x.image || '', when: x.when === 'after' ? 'after' : 'before',
        rows: (x.rows || []).map(row => row.map(b => Object.assign({}, b, {label: ml(b.label), action: b.action || 'noop'})))}));
    }
    if (p.history) { p.history.line = ml(p.history.line); p.history.empty = ml(p.history.empty); if (p.history.fake) p.history.fake.line = ml(p.history.fake.line); }
  }
  if (c.gate) for (const k of ['text', 'join_label', 'check_label', 'fail_text']) c.gate[k] = ml(c.gate[k]);
  c._layout = c._layout || {};
  c.strings = c.strings || {};
  c.admin_menu = c.admin_menu || {hidden: []};
  if (c.reply_menu) { const r = c.reply_menu; r.placeholder = ml(r.placeholder); r.intro = ml(r.intro); r.rows = (r.rows || []).map(row => row.map(b => ({label: ml(b.label), target: b.target || ''}))); }
  c.payments = c.payments || {};
  return c;
}

// ── mutation with undo ──────────────────────────────────────────────────
function snapshot(coalesceKey) {
  const now = Date.now();
  if (coalesceKey && coalesceKey === snapshot.key && now - lastPush < 1200) { lastPush = now; return; }
  snapshot.key = coalesceKey || null; lastPush = now;
  undoStack.push(JSON.stringify(cfg)); if (undoStack.length > 80) undoStack.shift(); redoStack = [];
}
snapshot.key = null;
function restoreSnap(s) { cfg = JSON.parse(s); if (!cfg.pages[sel]) sel = null; selBtn = null; fullRender(); }
function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(cfg)); restoreSnap(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(cfg)); restoreSnap(redoStack.pop()); }
function touched(opts = {}) {   // call after changing cfg
  try { localStorage.setItem('cx-draft-' + NAME, JSON.stringify(cfg)); } catch (e) {}
  renderCanvas(); renderPreview(); renderTop();
  if (opts.inspector) renderInspector();
}

// ══ page / action helpers ═══════════════════════════════════════════════
const P = id => cfg.pages[id];
const pname = id => (cfg.pages[id] && (cfg.pages[id].title || id)) || id;
const ML = (obj, lang = editLang) => (obj && (obj[lang] ?? '')) || '';

function parseAction(a) {

  if (a.startsWith('url:')) return {kind: 'url', url: a.slice(4)};
  if (a.startsWith('choose:')) { const p = a.split(':'); return {kind: 'choose', var: p[1] || '', value: p[2] || '', target: p.slice(3).join(':')}; }
  if (a.startsWith('confirm:')) return {kind: 'confirm', target: a.slice(8)};
  if (a.startsWith('setlang:')) { const p = a.split(':'); return {kind: 'setlang', lang: p[1] || '', target: p[2] || ''}; }
  if (a.startsWith('buy:')) { const p = a.split(':'); return {kind: 'buy', target: p[1] || '', low: p[2] || ''}; }

}
function buildAction(o) {
  switch (o.kind) {
    case 'page': return 'page:' + (o.target || '');
    case 'url': return 'url:' + (o.url || '');
    case 'choose': return `choose:${o.var || ''}:${o.value || ''}:${o.target || ''}`;
    case 'confirm': return 'confirm:' + (o.target || '');
    case 'setlang': return 'setlang:' + (o.lang || '') + (o.target ? ':' + o.target : '');
    case 'buy': return 'buy:' + (o.target || '') + (o.low ? ':' + o.low : '');

    case 'admin': return 'admin';

}

function actionSummary(a) {
  const o = parseAction(a);
  switch (o.kind) {
    case 'page': return '→ ' + (o.target ? pname(o.target) : '(pick a screen)');
    case 'url': return '🔗 ' + (o.url || '(link)');
    case 'choose': return `${o.var}=${o.value === '@' ? 'button text' : o.value} → ${o.target ? pname(o.target) : '?'}`;
    case 'confirm': return '“I paid” → ' + (o.target ? pname(o.target) : '?');
    case 'setlang': return '🌐 language ' + (o.lang || '?').toUpperCase() + ' → ' + (o.target ? pname(o.target) : 'start screen');
    case 'buy': return '🛒 buy with balance → ' + (o.target ? pname(o.target) : '?');

}
const enabledCoins = () => ((cfg.payments && cfg.payments.coins) || DEFAULT_COINS).filter(c => c.enabled !== false);

const NODE_W = 230;
function autoPosition(onlyMissing = true) {
  const start = cfg.start_page, depth = {}, q = [start]; depth[start] = 0;
  while (q.length) {
    const id = q.shift(), p = P(id); if (!p) continue;
    const next = [];
    p.rows.flat().forEach(b => { const t = actionTarget(b.action); if (t) next.push(t); });
    if (p.input && p.input.next) next.push(p.input.next);
    if (p.item_target) next.push(p.item_target);
    next.forEach(t => { if (P(t) && depth[t] === undefined) { depth[t] = depth[id] + 1; q.push(t); } });
  }
  const extra = Math.max(0, ...Object.values(depth)) + 1;
  Object.keys(cfg.pages).forEach(id => { if (depth[id] === undefined) depth[id] = extra; });
  const cols = {};
  Object.keys(cfg.pages).forEach(id => (cols[depth[id]] = cols[depth[id]] || []).push(id));
  for (const [d, ids] of Object.entries(cols)) ids.forEach((id, i) => {
    if (onlyMissing && cfg._layout[id]) return;
    cfg._layout[id] = [60 + d * 320, 60 + i * 230];
  });
}

function renderCanvas() {

    const info = TYPE_INFO[p.type] || TYPE_INFO.message;

    p.rows.forEach((row, ri) => row.forEach((b, bi) => {
      chips.push(h('div', {class: 'chip' + (bi === 0 && ri > 0 ? ' rowmark' : ''), 'data-r': ri, 'data-b': bi, title: actionSummary(b.action),
        onclick: ev => { ev.stopPropagation(); selectPage(id); selBtn = [ri, bi]; renderInspector(); },},
        (b.label[editLang] || b.label[cfg.default_lang] || '(no label)'),

    }));

      onpointerdown: ev => { if (ev.target.closest('.chip')) return; selectPage(id); }},

      h('div', {class: 'nb'}, stripTags(firstText(p.text)) || (p.type === 'list' ? 'Lists items from the shop' : '(no text)')),

const stripTags = s => String(s || '').replace(/<[^>]+>/g, '').slice(0, 90);

function drawEdges(temp) {
  const svg = $('#edges'); svg.replaceChildren();
  const ns = 'http://www.w3.org/2000/svg';
  const mk = (d, cls) => { const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); p.setAttribute('class', 'edge ' + cls); svg.append(p); return p; };
  const curve = (x1, y1, x2, y2) => { const dx = Math.max(60, Math.abs(x2 - x1) / 2); return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`; };
  const nodeEl = id => $(`.node[data-id="${id}"]`);
  const tgtPt = id => { const el = nodeEl(id); return el ? [el.offsetLeft, el.offsetTop + 18] : null; };
  for (const [id, p] of Object.entries(cfg.pages)) {
    const el = nodeEl(id); if (!el) continue;
    p.rows.forEach((row, ri) => row.forEach((b, bi) => {
      const o = parseAction(b.action); const t = ['page', 'choose', 'confirm', 'buy', 'setlang'].includes(o.kind) ? o.target : null;
      if (o.kind === 'buy' && o.low && P(o.low)) { const chip0 = el.querySelector(`.chip[data-r="${ri}"][data-b="${bi}"]`), z0 = tgtPt(o.low); if (chip0 && z0) mk(curve(el.offsetLeft + el.offsetWidth, el.offsetTop + chip0.offsetTop + chip0.offsetHeight / 2, z0[0], z0[1]), 'flow'); }
      if (!t || !P(t)) return;
      const chip = el.querySelector(`.chip[data-r="${ri}"][data-b="${bi}"]`); if (!chip) return;
      const a = [el.offsetLeft + el.offsetWidth, el.offsetTop + chip.offsetTop + chip.offsetHeight / 2], z = tgtPt(t);
      if (!z) return;
      const pth = mk(curve(a[0], a[1], z[0], z[1]), o.kind === 'choose' ? 'choose' : (o.kind === 'confirm' || o.kind === 'buy') ? 'confirm' : 'page');
      if (z[0] <= el.offsetLeft) pth.classList.add('back');     // links back to an earlier screen: keep them quiet
      if (sel === id || t === sel) pth.classList.add('hot');
    }));
    [p.input && p.input.next, p.item_target].filter(Boolean).forEach(t => {
      const z = P(t) && tgtPt(t); if (z) mk(curve(el.offsetLeft + el.offsetWidth, el.offsetTop + 18, z[0], z[1]), 'flow');
    });
  }
  if (temp) mk(curve(temp[0], temp[1], temp[2], temp[3]), 'page hot');
}

function applyView() { $('#world').style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`; }
function toWorld(cx, cy) { const r = $('#canvasWrap').getBoundingClientRect(); return [(cx - r.left - view.x) / view.s, (cy - r.top - view.y) / view.s]; }

function startDrag(ev, id) {
  if (ev.button !== 0) return; ev.preventDefault(); selectPage(id);
  const start = [ev.clientX, ev.clientY], orig = [...(cfg._layout[id] || [0, 0])];
  let moved = false;
  const mv = e => {
    const dx = (e.clientX - start[0]) / view.s, dy = (e.clientY - start[1]) / view.s;
    if (!moved && Math.hypot(dx, dy) < 3) return;
    if (!moved) { moved = true; snapshot(); }
    cfg._layout[id] = [Math.round(orig[0] + dx), Math.round(orig[1] + dy)];
    const el = $(`.node[data-id="${id}"]`); el.style.left = cfg._layout[id][0] + 'px'; el.style.top = cfg._layout[id][1] + 'px'; drawEdges();
  };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); if (moved) touched(); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up);
}

function startConnect(ev, id, ri, bi) {
  ev.preventDefault(); ev.stopPropagation(); if (ev.button !== 0) return;
  const el = $(`.node[data-id="${id}"]`), chip = el.querySelector(`.chip[data-r="${ri}"][data-b="${bi}"]`);
  const a = [el.offsetLeft + el.offsetWidth, el.offsetTop + chip.offsetTop + chip.offsetHeight / 2];
  const mv = e => {
    const w = toWorld(e.clientX, e.clientY); drawEdges([a[0], a[1], w[0], w[1]]);
    document.querySelectorAll('.node').forEach(n => n.classList.remove('dropok'));
    const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('.node'); if (t && t.dataset.id !== id) t.classList.add('dropok');
  };
  const up = e => {
    removeEventListener('pointermove', mv); removeEventListener('pointerup', up);
    const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('.node');
    document.querySelectorAll('.node').forEach(n => n.classList.remove('dropok'));
    if (t && t.dataset.id) {
      snapshot(); const b = P(id).rows[ri][bi], o = parseAction(b.action);
      if (o.kind === 'choose' || o.kind === 'confirm' || o.kind === 'buy' || o.kind === 'setlang') o.target = t.dataset.id; else { o.kind = 'page'; o.target = t.dataset.id; }
      b.action = buildAction(o); toast(`Connected to “${pname(t.dataset.id)}”`, 'ok');

function setupCanvasEvents() {
  const wrap = $('#canvasWrap');
  wrap.addEventListener('pointerdown', ev => {
    if (ev.target.closest('.node,.tools,.zoom,#phone')) return;
    ev.preventDefault(); const s = [ev.clientX, ev.clientY, view.x, view.y];
    wrap.style.cursor = 'grabbing';
    const mv = e => { view.x = s[2] + e.clientX - s[0]; view.y = s[3] + e.clientY - s[1]; applyView(); };
    const up = () => { wrap.style.cursor = ''; removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
  wrap.addEventListener('wheel', ev => {
    ev.preventDefault(); const r = wrap.getBoundingClientRect();
    const ns = Math.min(1.8, Math.max(0.3, view.s * (ev.deltaY < 0 ? 1.1 : 1 / 1.1)));
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;

  }, {passive: false});
  $('#zIn').onclick = () => { view.s = Math.min(1.8, view.s * 1.2); applyView(); };
  $('#zOut').onclick = () => { view.s = Math.max(0.3, view.s / 1.2); applyView(); };
  $('#fitBtn').onclick = fitView;
  $('#addFlow').onclick = openFlowModal;
  $('#autoLayout').onclick = () => { snapshot(); autoPosition(false); touched(); fitView(); };
  $('#addScreen').onclick = () => addScreen();
}
function fitView() {
  const ids = Object.keys(cfg.pages); if (!ids.length) return;
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  ids.forEach(id => { const p = cfg._layout[id] || [0, 0], el = $(`.node[data-id="${id}"]`); x1 = Math.min(x1, p[0]); y1 = Math.min(y1, p[1]); x2 = Math.max(x2, p[0] + NODE_W); y2 = Math.max(y2, p[1] + (el ? el.offsetHeight : 160)); });

  view.s = s; view.x = (r.width - (x2 - x1) * s) / 2 - x1 * s; view.y = (r.height - (y2 - y1) * s) / 2 - y1 * s; applyView();
}

function allVarNames(p) {

  enabledCoins().forEach(c => { v.add(c.code + '_price'); v.add(c.code + '_amount'); });
  if (p.item_lookup || p.type === 'receipt') ['name', 'description', 'price'].forEach(x => v.add(x));
  if (p.type === 'history') ['purchases', 'purchase_count', 'purchase_total'].forEach(x => v.add(x));
  if (p.type === 'receipt') ['coin', 'wallet', 'crypto_amount', 'crypto_price', 'usd_amount', 'amount', 'request_id'].forEach(x => v.add(x));
  for (const q of Object.values(cfg.pages)) {

// ══ checks ═════════════════════════════════════════════════════════════
function computeIssues() {
  const out = [], push = (level, page, msg) => out.push({level, page, msg});
  if (!cfg.pages[cfg.start_page]) push('error', null, 'The start screen does not exist.');
  const incoming = {}, incomingChoose = {};
  if (cfg.gate && cfg.gate.enabled) {
    if (!/^https:\/\//.test(cfg.gate.url || '')) push('error', null, 'Channel gate: add the join link (https://…).');
    if (cfg.gate.mode !== 'dummy' && !/^(@[A-Za-z]\w{3,31}|-100\d{5,15})$/.test(cfg.gate.channel || '')) push('error', null, 'Channel gate: enter the channel (@name or numeric id) so the bot can check members.');
  }
  for (const [id, p] of Object.entries(cfg.pages)) {
    const nm = pname(id);
    if (!Object.values(p.text).some(v => (v || '').trim()) && !p.image && p.type !== 'receipt') push('warn', id, `“${nm}” has no text and no picture.`);
    if (p.type === 'history' && !Object.values(p.text).some(v => (v || '').includes('{purchases}'))) push('warn', id, `“${nm}” is a purchase-history screen but its text has no {purchases}.`);
    if (cfg.langs.length > 1) { const miss = cfg.langs.filter(l => !(p.text[l] || '').trim()); if (miss.length && miss.length < cfg.langs.length) push('warn', id, `“${nm}” has no text in ${miss.map(l => l.toUpperCase()).join(', ')}.`); }
    p.rows.forEach(row => row.forEach(b => {
      const lab = b.label[cfg.default_lang] || Object.values(b.label).find(Boolean);
      if (!lab) push('error', id, `“${nm}” has a button with no label.`);
      const o = parseAction(b.action), bl = lab || '(no label)';
      if (o.kind === 'buy' && o.low) { if (!cfg.pages[o.low]) push('error', id, `Button “${bl}” on “${nm}”: the “balance too small” screen no longer exists.`); else incoming[o.low] = 1; }
      if (o.kind === 'setlang' && !cfg.langs.includes(o.lang)) push('error', id, `Button “${bl}” on “${nm}” switches to a language this bot doesn't have (${o.lang}).`);
      if (o.kind === 'setlang' && !o.target) { /* returns to the start screen */ } else if (['page', 'confirm', 'choose', 'buy', 'setlang'].includes(o.kind)) {
        if (!o.target) push('error', id, `Button “${bl}” on “${nm}” doesn't open any screen yet.`);
        else if (!cfg.pages[o.target]) push('error', id, `Button “${bl}” on “${nm}” opens a screen that no longer exists.`);
        else incoming[o.target] = 1;

    h('div', {class: 'grow'}, field('Symbol goes', sel_([['after', 'After the number  (25ლ)'], ['before', 'Before the number  (ლ25)']], c.position, v => { setCur({position: v}); redraw(); })))),
    h('label', {class: 'chk'}, h('input', {type: 'checkbox', checked: !!c.space, onchange: ev => { setCur({space: ev.target.checked}); redraw(); }}), 'Put a space between number and symbol'));
  b.append(h('div', {class: 'card', style: 'margin-top:12px'}, h('b', {}, 'Preview'), h('div', {style: 'margin-top:6px;font-size:15px'}, `Balance: ${fmtMoney(25)}   ·   Price: ${fmtMoney(25.85)}   ·   Top-up: ${fmtMoney(100)}`)));
  b.append(h('h3', {style: 'margin:20px 0 8px'}, 'Exchange rate to USD'), h('div', {class: 'hint', style: 'margin:0 0 8px'}, 'Needed only to work out how much crypto to ask for: price → USD → coin. “Live” follows the market automatically.'));
  const res = h('div', {class: 'hint'}, '');
  b.append(h('div', {class: 'seg'},
    h('div', {class: 'opt' + (c.rate === 'auto' ? ' on' : ''), onclick: () => { setCur({rate: 'auto'}); redraw(); }}, h('b', {}, '📈 Live (recommended)'), h('span', {}, 'Updated automatically')),
    h('div', {class: 'opt' + (c.rate !== 'auto' ? ' on' : ''), onclick: () => { setCur({rate: c.rate !== 'auto' ? c.rate : Number((liveRate && liveRate.code === c.code ? liveRate.v : 1).toFixed(4))}); redraw(); }}, h('b', {}, '🔒 Fixed'), h('span', {}, 'You set the rate yourself'))));
  if (c.code === 'USD') b.append(h('div', {class: 'hint'}, 'US dollars need no conversion.'));
  else if (c.rate !== 'auto') b.append(field(`1 ${c.symbol} equals … USD`, inp(c.rate, v => { const n = parseFloat(v); if (n > 0) setCur({rate: n}); }, {type: 'number', step: '0.0001', min: '0'}), `So ${fmtMoney(100)} = ${(100 * Number(c.rate || 0)).toFixed(2)} USD before conversion to crypto.`));
  else b.append(h('div', {class: 'row'}, h('button', {onclick: async () => { res.textContent = 'Checking…'; const r = await refreshLiveRate(); res.textContent = r ? (r.ok ? '✓ ' : '✕ ') + r.msg : 'Could not reach the rate service'; res.style.color = r && r.ok ? 'var(--green)' : 'var(--red)'; }}, 'Check live rate'), res));
  b.append(h('div', {class: 'card', style: 'margin-top:16px;border-color:var(--yellow)'}, h('b', {}, '⚠ Existing prices are not converted'),
    h('div', {class: 'hint', style: 'margin:6px 0 0'}, 'Changing the currency only changes the symbol and the conversion. A product priced 25 stays 25 — in the new currency. Edit prices in Global Admin → Products. Balances work the same way.')));
  b.append(h('div', {class: 'row', style: 'margin-top:12px'}, h('button', {onclick: () => { let n = 0; edit(() => { n = stripMoneySigns(cfg); }, {inspector: true}); toast(n ? `Removed ${n} hard-coded “$” next to amounts` : 'No hard-coded “$” signs found next to amounts', n ? 'ok' : ''); }}, 'Clean up “$” in my texts'),
    h('button', {class: 'ghost danger', onclick: () => { edit(() => { delete cfg.currency; }); redraw(); }}, 'Remove currency')),
    h('div', {class: 'hint'}, 'Texts like “Price: {price} $” would show the symbol twice, so “$” right after an amount is removed automatically when you pick a currency. You can use {balance}, {price}, {amount} anywhere — {balance_num} gives the bare number.'));
}

function coinList() { if (!cfg.payments.coins) cfg.payments.coins = clone(DEFAULT_COINS); return cfg.payments.coins; }
function sPayments(b, redraw) {
  const coins = coinList();
  b.append(h('div', {class: 'hint', style: 'margin:0 0 10px'}, 'Coins offered for balance top-ups and orders. Amounts are converted at the live CoinGecko rate (stablecoins are 1:1 with USD). Users send funds to the wallet address you enter here.'));
  const t = h('table', {class: 't'}, h('tr', {}, ['On', 'Code', 'Shown as', 'Wallet address', 'CoinGecko id', 'Stable', ''].map(x => h('th', {}, x))));
  coins.forEach((c, i) => t.append(h('tr', {},
    h('td', {}, h('input', {type: 'checkbox', checked: c.enabled !== false, style: 'width:auto', onchange: ev => edit(() => { c.enabled = ev.target.checked; })})),
    h('td', {style: 'width:80px'}, inp(c.code, v => edit(() => { const old = c.code; c.code = v.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (envState && old !== c.code && envState.wallets[old] !== undefined && !envState.wallets[c.code]) { envState.wallets[c.code] = envState.wallets[old]; } if (KNOWN_COINS[c.code] && !c.cg_id) c.cg_id = KNOWN_COINS[c.code]; }, {key: 'cc' + i}))),
    h('td', {}, inp(c.label, v => edit(() => { c.label = v; }, {key: 'cl' + i}))),
    h('td', {}, inp((envState && envState.wallets[c.code]) || '', v => { if (!envState) return; envState.wallets[c.code] = v.replace(/\s/g, ''); renderTop(); }, {placeholder: 'wallet address'})),
    h('td', {style: 'width:130px'}, inp(c.cg_id || '', v => edit(() => { c.cg_id = v.toLowerCase().replace(/[^a-z0-9\-]/g, ''); }, {key: 'cg' + i}), {placeholder: c.stable ? '(not needed)' : 'bitcoin'})),
    h('td', {}, h('input', {type: 'checkbox', checked: !!c.stable, style: 'width:auto', onchange: ev => edit(() => { c.stable = ev.target.checked; })})),
    h('td', {}, h('button', {class: 'ghost danger', onclick: () => { edit(() => { coins.splice(i, 1); }); redraw(); }}, '✕')))));
  b.append(t, h('div', {class: 'row', style: 'margin-top:12px'}, h('button', {onclick: () => { edit(() => { coins.push({code: 'ETH', label: 'Ethereum', cg_id: 'ethereum', stable: false, enabled: true}); }); redraw(); }}, '＋ Add coin')));
  b.append(h('div', {class: 'hint', style: 'margin-top:12px'}, 'Tip: for a coin CoinGecko knows (BTC, LTC, ETH, TRX, TON, SOL, DOGE, XRP, BNB, BCH) the id fills in by itself. Other coins need their CoinGecko id (see coingecko.com → the coin’s “API id”). Automatic deposit detection is only available for BTC, LTC and USDT; other coins are confirmed by you through the “I paid” button.'));
}

function sAdminMenu(b) {
  const hidden = new Set(cfg.admin_menu.hidden || []);
  b.append(h('div', {class: 'hint', style: 'margin:0 0 10px'}, 'Choose which features show up in the bot’s in-Telegram admin menu. Hidden features stay available in the web Global Admin.'));
  ADMIN_ITEMS.forEach(([k, nm]) => b.append(h('label', {class: 'chk'}, h('input', {type: 'checkbox', checked: !hidden.has(k), onchange: ev => edit(() => { const s = new Set(cfg.admin_menu.hidden || []); if (ev.target.checked) s.delete(k); else s.add(k); cfg.admin_menu.hidden = [...s]; })}), nm)));
}

function sMessages(b, redraw) {
  const keys = Object.keys(sysStrings).filter(k => Object.keys(sysStrings[k]).some(l => typeof sysStrings[k][l] === 'string'));
  b.append(h('div', {class: 'hint', style: 'margin:0 0 8px'}, 'Built-in messages the bot sends outside your screens (order confirmation, product details, balance, referral, language picker…). Edit one to override it; clear the box to go back to the default. Keep {placeholders} as they are. Editing language: ', h('b', {}, LANG_NAMES[editLang] || editLang)));
  const q = h('input', {placeholder: 'Search…', style: 'margin-bottom:10px'}); b.append(q);
  const list = h('div'); b.append(list);
  const draw = () => {
    list.replaceChildren(); const term = q.value.toLowerCase();
    keys.filter(k => !term || k.toLowerCase().includes(term) || (sysStrings[k][editLang] || sysStrings[k].ka || '').toLowerCase().includes(term)).forEach(k => {
      const def = sysStrings[k][editLang] ?? sysStrings[k].ka ?? sysStrings[k].en ?? '', ov = (cfg.strings[k] || {})[editLang] || '';
      list.append(h('div', {class: 'card'}, h('div', {class: 'row'}, h('b', {style: 'font-size:12px'}, k), ov ? h('span', {class: 'tag y'}, 'edited') : null, h('span', {class: 'grow'}),
        ov ? h('button', {class: 'ghost', onclick: () => { edit(() => { delete cfg.strings[k][editLang]; if (!Object.keys(cfg.strings[k]).length) delete cfg.strings[k]; }); draw(); }}, 'Reset') : null),
        (() => { const ta = h('textarea', {placeholder: def, style: 'min-height:54px;margin-top:6px', oninput: ev => { edit(() => { if (ev.target.value) (cfg.strings[k] = cfg.strings[k] || {})[editLang] = ev.target.value; else if (cfg.strings[k]) { delete cfg.strings[k][editLang]; if (!Object.keys(cfg.strings[k]).length) delete cfg.strings[k]; } }, {key: 'ss' + k + editLang}); }}); ta.value = ov; return ta; })()));
    });
    if (!list.children.length) list.append(h('div', {class: 'hint'}, keys.length ? 'Nothing matches.' : 'This bot has no editable system messages.'));
  };
  q.oninput = draw; draw();
}

function sImages(b, redraw) {
  b.append(dropZone(redraw), h('div', {class: 'hint', style: 'margin:-4px 0 10px'}, 'Pictures, GIFs and videos can be used on any screen. Deleting is blocked while a screen still uses the picture.'),
    imageGrid('', null, async nm => { if (!confirm('Delete ' + nm + '?')) return; try { await api(B('/api/images/' + encodeURIComponent(nm)), {method: 'DELETE'}); await loadImages(); redraw(); } catch (e) { toast(e.message, 'err'); } }));
}

async function sHistory(b, redraw) {
  b.append(h('div', {class: 'hint', style: 'margin:0 0 10px'}, 'Every Publish keeps the previous version here. Loading one puts it in the editor — nothing goes live until you Publish.'));
  try {
    const r = await api(B('/api/history'));
    if (!r.items.length) b.append(h('div', {class: 'hint'}, 'No earlier versions yet.'));
    r.items.forEach(it => { const d = it.id.replace(/^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)$/, '$1-$2-$3 $4:$5:$6');
      b.append(h('div', {class: 'card row'}, h('b', {class: 'grow'}, d), h('span', {class: 'mut'}, it.pages + ' screens'), h('button', {onclick: async () => {
        if (!confirm('Load the version from ' + d + ' into the editor?')) return;
        try { const c = await api(B('/api/history/' + it.id)); snapshot(); cfg = normalize(c); autoPosition(); sel = null; closeModal(); fullRender(); toast('Loaded — press Publish to make it live', 'ok'); } catch (e) { toast(e.message, 'err'); } }}, 'Load'))); });
  } catch (e) { b.append(h('div', {class: 'hint'}, e.message)); }
}

// ══ publish ═════════════════════════════════════════════════════════════
async function publish() {
  const errs = computeIssues().filter(i => i.level === 'error');
  if (errs.length) { toast(`Fix ${errs.length} problem(s) first`, 'err'); showIssues(); return; }
  const btn = $('#publishBtn'); btn.disabled = true; btn.textContent = 'Publishing…';
  try {
    const needRestart = dirtyEnv();
    if (needRestart && !confirm('Token / admin / wallet changes restart the bot for a few seconds. Continue?')) { btn.disabled = false; btn.textContent = 'Publish'; return; }
    if (dirtyCfg()) { await api(B('/api/menu-config'), {body: cfg}); publishedStr = JSON.stringify(cfg); }
    if (needRestart) {
      await api(B('/api/env'), {body: {tokens: envState.tokens.filter(Boolean), admins: envState.admins.filter(Boolean), wallets: envState.wallets}});
      await api(B('/api/restart'), {method: 'POST', body: {}}); envOrig = JSON.stringify(envState);
    }
    try { localStorage.removeItem('cx-draft-' + NAME); } catch (e) {}
    toast(needRestart ? 'Published and bot restarted ✓' : 'Published — your bot is updated ✓', 'ok');
  } catch (e) { toast('Publish failed: ' + e.message, 'err'); }
  btn.disabled = false; btn.textContent = 'Publish'; renderTop();
}

// ══ boot ════════════════════════════════════════════════════════════════
function fullRender() { renderTop(); renderCanvas(); renderInspector(); renderPreview(); }
async function boot() {
  setupCanvasEvents();
  const [c, env, ss, pd, ft] = await Promise.all([api(B('/api/menu-config')), api(B('/api/env')).catch(() => null), api(B('/api/system-strings')).catch(() => ({strings: {}})), api(B('/api/preview-data')).catch(() => previewData), api(B('/api/features')).catch(() => ({})), loadImages()]);
  features = ft || {};
  cfg = normalize(c.config || c); sysStrings = ss.strings || {}; previewData = pd;
  autoPosition(true);
  publishedStr = JSON.stringify(cfg);
  refreshLiveRate().then(() => renderPreview());
  envState = env ? {tokens: env.tokens || [], admins: env.admins || [], wallets: Object.assign({BTC: '', LTC: '', USDT: ''}, env.wallets || {})} : {tokens: [], admins: [], wallets: {}};
  envOrig = JSON.stringify(envState);
  editLang = cfg.default_lang;
  try {
    const draft = localStorage.getItem('cx-draft-' + NAME);
    if (draft && draft !== JSON.stringify(cfg) && confirm('You have unpublished changes from your last visit. Restore them?')) { cfg = normalize(JSON.parse(draft)); autoPosition(true); } else localStorage.removeItem('cx-draft-' + NAME);
  } catch (e) {}
  sel = null; pv.page = cfg.start_page; selectPage(cfg.start_page);
  fullRender(); fitView(); checkTokens(null);
  if (cfg.pages[cfg.start_page] && Object.keys(cfg.pages).length === 1 && !cfg.pages[cfg.start_page].rows.length) $('#tips').textContent = 'Start here: write your welcome text on the right, then add buttons — each can open a new screen.';
}
$('#publishBtn').onclick = publish; $('#settingsBtn').onclick = () => openSettings(); $('#issuesBtn').onclick = showIssues;
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
$('#phoneBtn').onclick = () => { showPhone = !showPhone; renderPreview(); };
addEventListener('keydown', ev => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); publish(); }
  else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !typing) { ev.preventDefault(); ev.shiftKey ? redo() : undo(); }
  else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y' && !typing) { ev.preventDefault(); redo(); }
  else if (ev.key === 'Escape') closeModal();
});
addEventListener('beforeunload', ev => { if (cfg && dirty()) { ev.preventDefault(); ev.returnValue = ''; } });
boot().catch(e => { document.body.prepend(h('div', {style: 'padding:30px;color:var(--red)'}, 'Could not load the builder: ' + e.message)); });
</script>
{% endraw %}
</body>
