{% extends "base.html" %}
{% block title %}Attach Existing Bot — Bot Panel{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Attach Existing Bot</h1>
    <a href="{{ url_for('dashboard') }}" class="btn btn-ghost">&larr; Dashboard</a>
</div>
<div class="card" style="max-width:600px;">
    <p style="color:var(--text2); font-size:14px; margin-bottom:20px;">
        Register a bot that's already deployed on this server.
    </p>
    <form method="POST">
        <div class="form-group">
            <label>Internal Name (unique ID, no spaces)</label>
            <input type="text" name="name" placeholder="e.g. automated-bot" required pattern="[a-zA-Z0-9_-]+">
        </div>
        <div class="form-group">
            <label>Display Name (shown in dashboard)</label>
            <input type="text" name="display_name" placeholder="e.g. Mamahadesa Main Bot">
        </div>
        <div class="form-group">
            <label>Bot Directory (absolute path)</label>
            <input type="text" name="directory" placeholder="/opt/automated-bot" required>
        </div>
        <div class="form-group">
            <label>Systemd Service Name</label>
            <input type="text" name="service" placeholder="automated-bot" required>
        </div>
        <button type="submit" class="btn btn-primary">&#128279; Attach Bot</button>
    </form>
</div>
{% endblock %}
