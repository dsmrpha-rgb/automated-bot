{% extends "base.html" %}
{% block title %}Deploy New Bot — Bot Panel{% endblock %}
{% block content %}
<div class="page-header">
    <h1>+ Deploy New Bot</h1>
    <a href="{{ url_for('dashboard') }}" class="btn btn-ghost">&larr; Dashboard</a>
</div>
<div class="card" style="max-width:600px;">
    <form method="POST">
        <div class="form-group">
            <label>Bot Name (used as folder name and service ID)</label>
            <input type="text" name="name" placeholder="e.g. shop-bot-2" required pattern="[a-zA-Z0-9_-]+">
        </div>
        <div class="form-group">
            <label>Git Repository URL</label>
            <input type="text" name="repo" placeholder="https://github.com/user/repo.git" required>
        </div>
        <div class="form-group">
            <label>Bot Tokens (comma-separated)</label>
            <input type="text" name="bot_tokens" placeholder="123456:ABC..." required>
        </div>
        <div class="form-group">
            <label>Admin IDs (comma-separated)</label>
            <input type="text" name="admin_ids" placeholder="123456789">
        </div>
        <button type="submit" class="btn btn-primary">&#128640; Clone & Deploy</button>
    </form>
</div>
{% endblock %}
