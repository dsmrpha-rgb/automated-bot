{% macro sidebar(city, cats, current) %}<aside aria-label="Навигация по каталогу" class="shop-catalog__sidebar">
<details class="shop-panel shop-city-picker"><summary class="shop-city-picker__summary"><span aria-hidden="true" class="shop-location__icon"><span class="shop-pin"></span></span><span class="shop-city-picker__label"><small>Город</small><strong>{{ city|capitalize }}</strong></span><span aria-hidden="true" class="shop-city-picker__chevron"></span></summary>
<ul class="shop-city-picker__options">{% for c in all_cities %}<li><a class="shop-category-link"{% if c == city %} aria-current="true"{% endif %} href="{{ url_for('city_page', city=c) }}">{{ c|capitalize }}</a></li>{% endfor %}</ul></details>
{% if cats is not none %}<nav aria-labelledby="shop-current-categories-title" class="shop-category-nav shop-panel"><h2 id="shop-current-categories-title">Категории</h2><a class="shop-category-link" href="{{ url_for('city_page', city=city) }}">Все категории</a>{% for k, c in cats.items() %}<a class="shop-category-link"{% if k == current %} aria-current="page"{% endif %} href="{{ url_for('products', city=city, cat=k) }}">{{ c.name }}</a>{% endfor %}</nav>{% endif %}
</aside>{% endmacro %}
