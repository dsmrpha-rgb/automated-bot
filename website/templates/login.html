{% extends "base.html" %}{% block body %}
<div class="box auth"><h1>Sign in Website -<br>საიტზე შესვლა</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Login - ლოგინი</label><input name="login" autocomplete="username" required autofocus>
<label>Password - პაროლი</label><input name="password" type="password" autocomplete="current-password" placeholder="Password - პაროლი" required>
<button class="go">☠ Sign in - შესვლა ☠</button></form>
<div class="note">No account? <a href="{{ url_for('register', next=request.args.get('next','')) }}" style="color:#6fa8ff">Registration - რეგისტრაცია</a></div></div>
{% endblock %}
